<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<meta name="description" content="Hand Drone XS is a browser-based 3D endless runner controlled with real-time hand gestures using your webcam, Three.js, and MediaPipe." />
<meta name="robots" content="index,follow,max-image-preview:large" />
<meta name="theme-color" content="#060817" />
<link rel="canonical" href="https://joenasriani.github.io/hand-drone-game/" />
<link rel="icon" href="logo.png" type="image/png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Hand Drone XS" />
<meta property="og:title" content="Hand Drone XS" />
<meta property="og:description" content="Pilot a 3D drone in your browser using real-time hand gestures captured by your webcam." />
<meta property="og:url" content="https://joenasriani.github.io/hand-drone-game/" />
<meta property="og:image" content="https://joenasriani.github.io/hand-drone-game/logo.png" />
<meta property="og:image:alt" content="Hand Drone XS logo" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Hand Drone XS",
  "description": "A browser-based 3D endless runner where the player pilots a drone using real-time hand gestures captured by a webcam.",
  "url": "https://joenasriani.github.io/hand-drone-game/",
  "image": "https://joenasriani.github.io/hand-drone-game/logo.png",
  "genre": ["Endless runner", "Browser game", "Gesture-controlled game"],
  "gamePlatform": "Web browser",
  "playMode": "SinglePlayer",
  "applicationCategory": "Game",
  "author": {
    "@type": "Person",
    "name": "Joe Nasr"
  }
}
</script>
<style>
/* ===== SECTION: BASE LAYOUT ===== */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060817;font-family:Segoe UI,Arial,sans-serif}
#game-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#060817}

/* ===== SECTION: AUDIO CONTROLS ===== */
.audio-controls{position:fixed;top:16px;right:16px;z-index:90;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:min(360px,calc(100vw - 24px))}
.audio-controls button,#sound-toggle,#music-toggle{border:1px solid rgba(0,210,255,.75);border-radius:999px;padding:12px 16px;color:#00d2ff;background:rgba(6,8,23,.84);box-shadow:0 0 24px rgba(0,210,255,.25);font:900 12px Courier New,monospace;text-transform:uppercase;cursor:pointer}
.audio-controls button.is-on,#sound-toggle.is-on,#music-toggle.is-on{color:#00ffd5;border-color:#00ffd5}
.music-volume{width:92px;accent-color:#00ffd5;cursor:pointer}

@media(max-width:640px){.audio-controls{top:10px;right:10px;gap:5px}.audio-controls button,#sound-toggle,#music-toggle{padding:8px 9px;font-size:9px}.music-volume{width:70px}}
</style>

<script>
// ===== SECTION: CONFIG OVERRIDES =====
// Must run before config.js so shared bootstrap scripts see the iframe tuning values.
window.GAME_CONFIG=Object.assign({},window.GAME_CONFIG||{},{
  handDeadZoneX:.35,
  handDeadZoneY:.18,
  handSmoothing:.24,
  droneLerpSpeed:.22,
  targetLerpSpeed:.24,
  baseSpeed:.38,
  maxSpeedLevel:14,
  speedIncrement:.16,
  maxBaseGameSpeed:4.2,
  ringSpawnChance:.88
});
</script>
<script src="config.js"></script>
</head>
<body>
<!-- ===== SECTION: GAME HOST ===== -->
<iframe id="game-frame" src="index.html" allow="camera; fullscreen; autoplay" title="Hand Drone XS game"></iframe>

<!-- ===== SECTION: AUDIO CONTROLS ===== -->
<!-- Audio behavior is centralized in audio-sfx.js and audio-start-unlock.js via config.js. -->
<div class="audio-controls" aria-label="Audio controls">
  <button id="sound-toggle" type="button" aria-pressed="false">Enable SFX</button>
  <button id="music-toggle" type="button" aria-pressed="false">Music On</button>
  <input id="music-volume" class="music-volume" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="Music volume" />
</div>
</body>
</html>
