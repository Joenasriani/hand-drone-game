<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hand Drone XS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060817;font-family:Segoe UI,Arial,sans-serif}#game-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#060817}#sound-toggle{position:fixed;top:16px;right:16px;z-index:90;border:1px solid rgba(0,210,255,.75);border-radius:999px;padding:12px 16px;color:#00d2ff;background:rgba(6,8,23,.84);box-shadow:0 0 24px rgba(0,210,255,.25);font:900 12px Courier New,monospace;text-transform:uppercase;cursor:pointer}#sound-toggle.is-on{color:#00ffd5;border-color:#00ffd5}.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;perspective:1100px;background:radial-gradient(circle at 50% 45%,rgba(0,210,255,.2),transparent 35%),linear-gradient(135deg,#060817,#160927);animation:fade .8s ease-in-out 3.2s forwards}.title{position:relative;font:950 clamp(48px,11vw,160px)/.9 Impact,Arial Black,sans-serif;letter-spacing:clamp(4px,.9vw,18px);color:#00d2ff;text-align:center;text-transform:uppercase;text-shadow:0 1px 0 #0099c7,0 2px 0 #0088b4,0 3px 0 #0073a0,0 8px 18px rgba(0,210,255,.8),0 0 70px rgba(255,71,87,.5);animation:float 2.5s ease-in-out infinite alternate}.title:before{content:attr(data-text);position:absolute;color:rgba(255,71,87,.75);transform:translate3d(12px,12px,-42px);z-index:-1}.sub{margin-top:20px;font:800 clamp(13px,2vw,24px) Courier New,monospace;letter-spacing:6px;color:#ff6b81;text-align:center;text-shadow:0 0 20px #ff4757}.grid{position:absolute;width:min(900px,90vw);height:240px;bottom:7vh;left:50%;transform:translateX(-50%) rotateX(72deg);background-image:linear-gradient(rgba(0,210,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,71,87,.18) 1px,transparent 1px);background-size:46px 46px;animation:grid 1.1s linear infinite;opacity:.6}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px),radial-gradient(circle,#00d2ff 0 1px,transparent 1.2px);background-size:90px 90px,150px 150px;opacity:.45;animation:stars 3.5s linear forwards}@keyframes fade{to{opacity:0;visibility:hidden;transform:scale(1.04)}}@keyframes float{from{transform:rotateX(15deg) rotateY(-18deg) translateZ(80px)}to{transform:rotateX(12deg) rotateY(16deg) translateZ(96px)}}@keyframes grid{to{background-position:0 46px,46px 0}}@keyframes stars{to{background-position:0 220px,30px 300px}}@media(max-width:640px){#sound-toggle{top:10px;right:10px;padding:9px 11px;font-size:10px}.sub{letter-spacing:4px}.grid{height:170px}}
</style>
<script src="config.js"></script>
<script>
window.GAME_CONFIG=Object.assign({},window.GAME_CONFIG||{},{handDeadZoneX:.35,handDeadZoneY:.18,handSmoothing:.24,droneLerpSpeed:.22,targetLerpSpeed:.24,baseSpeed:.38,maxSpeedLevel:14,speedIncrement:.16,maxBaseGameSpeed:4.2,ringSpawnChance:.88});
</script>
</head>
<body>
<iframe id="game-frame" src="index.html" allow="camera; fullscreen" title="Hand Drone XS game"></iframe>
<button id="sound-toggle" type="button" aria-pressed="false">Enable SFX</button>
<div class="splash" aria-hidden="true"><div class="stars"></div><div class="grid"></div><div><div class="title" data-text="HAND DRONE XS">HAND DRONE XS</div><div class="sub">SIMULATED 3D PILOT BOOT</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<script>
const frame=document.getElementById('game-frame'),soundToggle=document.getElementById('sound-toggle');let soundEnabled=false,soundsReady=false,previousScore=0,previousGameOverVisible=false,previousHandLocked=false,lastHandSoundAt=0,hookIntervalId=null;const sounds={};
function clampSample(v){return Math.max(-1,Math.min(1,v));}function encodeWav(samples,sampleRate){const buffer=new ArrayBuffer(44+samples.length*2),view=new DataView(buffer),ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};ws(0,'RIFF');view.setUint32(4,36+samples.length*2,true);ws(8,'WAVE');ws(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,samples.length*2,true);let offset=44;for(let i=0;i<samples.length;i++,offset+=2)view.setInt16(offset,clampSample(samples[i])*0x7fff,true);let binary='';const bytes=new Uint8Array(buffer);for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return 'data:audio/wav;base64,'+btoa(binary);}function makeTone({duration=.2,start=440,end=440,volume=.8,type='sine',noise=0}){const sampleRate=22050,length=Math.max(1,Math.floor(duration*sampleRate)),samples=new Float32Array(length);for(let i=0;i<length;i++){const t=i/sampleRate,p=i/length,f=start+(end-start)*p,phase=2*Math.PI*f*t;let wave=Math.sin(phase);if(type==='square')wave=Math.sign(wave||1);if(type==='saw')wave=2*((f*t)%1)-1;if(type==='triangle')wave=2*Math.abs(2*((f*t)%1)-1)-1;const env=Math.min(p/.04,1)*Math.pow(1-p,1.2);samples[i]=((wave*(1-noise))+((Math.random()*2-1)*noise))*env*volume;}return encodeWav(samples,sampleRate);}function buildSounds(){if(soundsReady||!window.Howl)return;Howler.volume(1);sounds.boot=new Howl({src:[makeTone({duration:.9,start:90,end:520,volume:.95,type:'saw',noise:.05})],volume:1});sounds.start=new Howl({src:[makeTone({duration:.35,start:260,end:980,volume:.9,type:'triangle'})],volume:1});sounds.lock=new Howl({src:[makeTone({duration:.2,start:760,end:1360,volume:.85,type:'sine'})],volume:1});sounds.collect=new Howl({src:[makeTone({duration:.26,start:940,end:1860,volume:1,type:'triangle'})],volume:1});sounds.crash=new Howl({src:[makeTone({duration:.7,start:210,end:35,volume:1,type:'saw',noise:.55})],volume:1});soundsReady=true;}function setSoundEnabled(on){buildSounds();soundEnabled=on;Howler.mute(!on);soundToggle.classList.toggle('is-on',on);soundToggle.setAttribute('aria-pressed',String(on));soundToggle.textContent=on?'SFX On':'Enable SFX';}function playSound(n){if(!soundEnabled)return;buildSounds();sounds[n]?.play();}function enableSound(){const was=soundEnabled;setSoundEnabled(true);if(!was)playSound('boot');}soundToggle.addEventListener('click',enableSound);
function normalizeMissionCopy(doc){const modal=doc.getElementById('game-over');if(!modal)return;const h=modal.querySelector('h1'),b=modal.querySelector('button');if(h)h.textContent='MISSION FAILED';if(b)b.textContent='REBOOT MISSION';}
function hookGameEvents(){const doc=frame.contentDocument||frame.contentWindow?.document;if(!doc)return;const start=doc.getElementById('start-button'),scoreEl=doc.getElementById('score'),over=doc.getElementById('game-over'),hand=doc.getElementById('hand-status');if(hookIntervalId)clearInterval(hookIntervalId);normalizeMissionCopy(doc);if(start)start.addEventListener('click',()=>{enableSound();playSound('start');});hookIntervalId=setInterval(()=>{normalizeMissionCopy(doc);const score=Number(scoreEl?.textContent||0);if(score>previousScore)playSound('collect');previousScore=score;const overVisible=over&&getComputedStyle(over).display!=='none';if(overVisible&&!previousGameOverVisible)playSound('crash');previousGameOverVisible=Boolean(overVisible);const locked=Boolean(hand?.classList.contains('locked')),now=performance.now();if(locked&&!previousHandLocked&&now-lastHandSoundAt>900){playSound('lock');lastHandSoundAt=now;}previousHandLocked=locked;},100);}frame.addEventListener('load',hookGameEvents);
</script>
</body>
</html>
