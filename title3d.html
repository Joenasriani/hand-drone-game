<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Drone XS</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#060817; font-family:'Segoe UI',Arial,sans-serif; }
    #game-frame { position:fixed; inset:0; width:100%; height:100%; border:0; z-index:1; background:#060817; }
    #sound-toggle { position:fixed; top:16px; right:16px; z-index:90; border:1px solid rgba(0,210,255,.7); border-radius:999px; padding:12px 16px; color:#00d2ff; background:rgba(6,8,23,.82); box-shadow:0 0 24px rgba(0,210,255,.25); font:900 12px 'Courier New',monospace; letter-spacing:1px; text-transform:uppercase; cursor:pointer; backdrop-filter:blur(8px); }
    #sound-toggle.is-on { color:#00ffd5; border-color:rgba(0,255,213,.8); box-shadow:0 0 28px rgba(0,255,213,.35); }
    #title-3d-overlay { position:fixed; inset:0; z-index:50; overflow:hidden; display:grid; place-items:center; pointer-events:none; perspective:1100px; background:radial-gradient(circle at 50% 45%,rgba(0,210,255,.18),transparent 34%),linear-gradient(135deg,rgba(6,8,23,.98),rgba(18,9,39,.96)); animation:overlayExit .8s ease-in-out 3.2s forwards; }
    .starfield,.scanlines{position:absolute;inset:0;pointer-events:none}.starfield{background-image:radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.4px),radial-gradient(circle,rgba(0,210,255,.55) 0 1px,transparent 1.2px);background-size:90px 90px,150px 150px;background-position:0 0,30px 60px;animation:starsMove 3.6s linear forwards;opacity:.55}.scanlines{background:linear-gradient(to bottom,transparent 0 48%,rgba(0,210,255,.08) 50%,transparent 52%);background-size:100% 8px;mix-blend-mode:screen;opacity:.5}
    .title-stage{position:relative;transform-style:preserve-3d;animation:stageEnter 3.2s cubic-bezier(.12,.75,.2,1) forwards}.title-word{position:relative;font:950 clamp(48px,11vw,160px)/.9 Impact,Haettenschweiler,'Arial Black',sans-serif;letter-spacing:clamp(4px,.9vw,18px);color:#00d2ff;text-align:center;text-transform:uppercase;transform-style:preserve-3d;text-shadow:0 1px 0 #0099c7,0 2px 0 #0088b4,0 3px 0 #0073a0,0 4px 0 #005c86,0 8px 18px rgba(0,210,255,.7),0 0 48px rgba(0,210,255,.55),0 0 90px rgba(255,71,87,.42);animation:titleFloat 2.7s ease-in-out infinite alternate}.title-word:before,.title-word:after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}.title-word:before{color:rgba(255,71,87,.7);transform:translate3d(12px,12px,-42px);z-index:-1}.title-word:after{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.28);transform:translate3d(-9px,-7px,32px);filter:drop-shadow(0 0 16px rgba(255,255,255,.25))}.subtitle-3d{margin-top:22px;font:800 clamp(13px,2vw,24px)/1.2 'Courier New',monospace;letter-spacing:clamp(4px,.7vw,12px);color:#ff6b81;text-align:center;text-transform:uppercase;text-shadow:0 0 16px rgba(255,71,87,.8),0 0 36px rgba(255,71,87,.45);animation:subtitleBlink 1.1s steps(2) infinite}
    .holo-floor{position:absolute;width:min(900px,90vw);height:260px;bottom:8vh;left:50%;transform:translateX(-50%) rotateX(72deg);background-image:linear-gradient(rgba(0,210,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,71,87,.18) 1px,transparent 1px);background-size:46px 46px;border:1px solid rgba(0,210,255,.25);box-shadow:0 0 50px rgba(0,210,255,.18);animation:gridSlide 1.2s linear infinite;opacity:.55}.orbit{position:absolute;width:min(720px,82vw);height:min(720px,82vw);border:1px solid rgba(0,210,255,.28);border-radius:50%;transform:rotateX(70deg);box-shadow:0 0 40px rgba(0,210,255,.14),inset 0 0 40px rgba(255,71,87,.08);animation:orbitSpin 4s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#ffd700;box-shadow:0 0 24px #ffd700}.orbit:before{left:50%;top:-7px}.orbit:after{right:12%;bottom:10%;background:#00ffd5;box-shadow:0 0 24px #00ffd5}
    @keyframes stageEnter{0%{transform:translateZ(-520px) rotateX(32deg) rotateY(-42deg) scale(.55);opacity:0}45%{opacity:1}70%{transform:translateZ(40px) scale(1.04)}100%{transform:translateZ(0) scale(1);opacity:1}}@keyframes titleFloat{from{transform:rotateX(15deg) rotateY(-18deg) translateZ(80px) translateY(-3px)}to{transform:rotateX(12deg) rotateY(16deg) translateZ(95px) translateY(7px)}}@keyframes subtitleBlink{0%,70%{opacity:1}71%,100%{opacity:.58}}@keyframes gridSlide{from{background-position:0 0,0 0}to{background-position:0 46px,46px 0}}@keyframes starsMove{from{background-position:0 0,30px 60px}to{background-position:0 220px,30px 300px}}@keyframes orbitSpin{to{transform:rotateX(70deg) rotateZ(360deg)}}@keyframes overlayExit{to{opacity:0;visibility:hidden;transform:scale(1.04)}}
    @media(max-width:640px){#sound-toggle{top:10px;right:10px;padding:9px 11px;font-size:10px}.title-word{letter-spacing:4px}.subtitle-3d{margin-top:14px}.holo-floor{bottom:6vh;height:180px}}
  </style>
</head>
<body>
  <iframe id="game-frame" allow="camera; fullscreen" title="Hand Drone XS game"></iframe>
  <button id="sound-toggle" type="button" aria-pressed="false">Enable SFX</button>
  <div id="title-3d-overlay" aria-hidden="true">
    <div class="starfield"></div><div class="scanlines"></div><div class="holo-floor"></div><div class="orbit"></div>
    <div class="title-stage"><div class="title-word" data-text="HAND DRONE XS">HAND DRONE XS</div><div class="subtitle-3d">Simulated 3D Pilot Boot</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <script>
    const frame = document.getElementById('game-frame');
    const soundToggle = document.getElementById('sound-toggle');
    let soundEnabled = false, soundsReady = false, previousScore = 0, previousGameOverVisible = false, previousHandLocked = false, lastHandSoundAt = 0, hookIntervalId = null;
    const sounds = {};

    async function loadPatchedGame() {
      try {
        const response = await fetch('/index.html', { cache: 'no-store' });
        let html = await response.text();
        html = html.replace('let shakeTime = 0, shakeStrength = 0;', 'let shakeTime = 0, shakeStrength = 0, runStartedAt = 0;');
        html = html.replace('let baseSpeed = 0.15, currentSpeed = baseSpeed, targetX = 0, targetY = 5;', 'let baseSpeed = 0.38, currentSpeed = baseSpeed, targetX = 0, targetY = 5;');
        html = html.replace('const HAND_SMOOTHING = 0.12, HAND_DEAD_ZONE_X = 0.6, HAND_DEAD_ZONE_Y = 0.4;', 'const HAND_SMOOTHING = 0.24, HAND_DEAD_ZONE_X = 0.35, HAND_DEAD_ZONE_Y = 0.18;');
        html = html.replace('const DRONE_LERP = 0.095, TARGET_LERP = 0.11;', 'const DRONE_LERP = 0.22, TARGET_LERP = 0.24;');
        html = html.replace('const MAX_SPEED_LEVEL = 8, RINGS_PER_LEVEL = 20, SPEED_INCREMENT = 0.12, MAX_BASE_GAME_SPEED = 2.0;', 'const MAX_SPEED_LEVEL = 14, RINGS_PER_LEVEL = 20, SPEED_INCREMENT = 0.16, TIME_SPEED_INCREMENT = 0.24, MAX_BASE_GAME_SPEED = 4.2;');
        html = html.replace('function calculateSpeedMultiplier() { return 1 + (currentSpeedLevel - 1) * SPEED_INCREMENT; }', 'function calculateSpeedMultiplier() { const timeLevel = gameActive && runStartedAt ? Math.floor((performance.now() - runStartedAt) / 10000) : 0; return 1 + (currentSpeedLevel - 1) * SPEED_INCREMENT + timeLevel * TIME_SPEED_INCREMENT; }');
        html = html.replaceAll('gameActive = true;', 'gameActive = true; runStartedAt = performance.now();');
        frame.srcdoc = html;
      } catch (error) {
        console.error('Failed to load patched game. Falling back to static index.html:', error);
        frame.src = '/index.html';
      }
    }

    function clampSample(value){return Math.max(-1,Math.min(1,value));}
    function encodeWav(samples,sampleRate){const buffer=new ArrayBuffer(44+samples.length*2),view=new DataView(buffer);const ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};ws(0,'RIFF');view.setUint32(4,36+samples.length*2,true);ws(8,'WAVE');ws(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,samples.length*2,true);let offset=44;for(let i=0;i<samples.length;i++,offset+=2)view.setInt16(offset,clampSample(samples[i])*0x7fff,true);let binary='';const bytes=new Uint8Array(buffer);for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return 'data:audio/wav;base64,'+btoa(binary);}
    function makeTone({duration=.2,start=440,end=440,volume=.8,type='sine',noise=0}){const sampleRate=22050,length=Math.max(1,Math.floor(duration*sampleRate)),samples=new Float32Array(length);for(let i=0;i<length;i++){const t=i/sampleRate,p=i/length,freq=start+(end-start)*p,phase=2*Math.PI*freq*t;let wave=Math.sin(phase);if(type==='square')wave=Math.sign(wave||1);if(type==='saw')wave=2*((freq*t)%1)-1;if(type==='triangle')wave=2*Math.abs(2*((freq*t)%1)-1)-1;const attack=Math.min(p/.04,1),decay=Math.pow(1-p,1.2),env=attack*decay;samples[i]=((wave*(1-noise))+((Math.random()*2-1)*noise))*env*volume;}return encodeWav(samples,sampleRate);}
    function buildSounds(){if(soundsReady||!window.Howl)return;Howler.volume(1);sounds.boot=new Howl({src:[makeTone({duration:.9,start:90,end:520,volume:.95,type:'saw',noise:.05})],volume:1});sounds.start=new Howl({src:[makeTone({duration:.35,start:260,end:980,volume:.9,type:'triangle'})],volume:1});sounds.lock=new Howl({src:[makeTone({duration:.2,start:760,end:1360,volume:.85,type:'sine'})],volume:1});sounds.collect=new Howl({src:[makeTone({duration:.26,start:940,end:1860,volume:1,type:'triangle'})],volume:1});sounds.crash=new Howl({src:[makeTone({duration:.7,start:210,end:35,volume:1,type:'saw',noise:.55})],volume:1});soundsReady=true;}
    function setSoundEnabled(enabled){buildSounds();soundEnabled=enabled;Howler.mute(!enabled);soundToggle.classList.toggle('is-on',enabled);soundToggle.setAttribute('aria-pressed',String(enabled));soundToggle.textContent=enabled?'SFX On':'Enable SFX';}
    function playSound(name){if(!soundEnabled)return;buildSounds();sounds[name]?.play();}
    function enableSoundFromGesture(){const wasEnabled=soundEnabled;setSoundEnabled(true);if(!wasEnabled)playSound('boot');}
    soundToggle.addEventListener('click',enableSoundFromGesture);

    function normalizeMissionCopy(doc){const gameOverEl=doc.getElementById('game-over');if(!gameOverEl)return;const title=gameOverEl.querySelector('h1'),button=gameOverEl.querySelector('button');if(title)title.textContent='MISSION FAILED';if(button)button.textContent='REBOOT MISSION';}
    function hookGameEvents(){const doc=frame.contentDocument||frame.contentWindow?.document;if(!doc)return;const startButton=doc.getElementById('start-button'),scoreEl=doc.getElementById('score'),gameOverEl=doc.getElementById('game-over'),handStatusEl=doc.getElementById('hand-status');if(hookIntervalId)clearInterval(hookIntervalId);normalizeMissionCopy(doc);if(startButton)startButton.addEventListener('click',()=>{enableSoundFromGesture();playSound('start');});hookIntervalId=setInterval(()=>{normalizeMissionCopy(doc);const score=Number(scoreEl?.textContent||0);if(score>previousScore)playSound('collect');previousScore=score;const gameOverVisible=gameOverEl&&getComputedStyle(gameOverEl).display!=='none';if(gameOverVisible&&!previousGameOverVisible)playSound('crash');previousGameOverVisible=Boolean(gameOverVisible);const handLocked=Boolean(handStatusEl?.classList.contains('locked')),now=performance.now();if(handLocked&&!previousHandLocked&&now-lastHandSoundAt>900){playSound('lock');lastHandSoundAt=now;}previousHandLocked=handLocked;},100);}
    frame.addEventListener('load',hookGameEvents);
    loadPatchedGame();
  </script>
</body>
</html>
